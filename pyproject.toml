[project]
name = "mcp-memory"
version = "0.1.0"
description = "MCP Memory service"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501", "E712"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_memory"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
show_error_codes = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["mcp_memory.models.*"]
ignore_errors = true